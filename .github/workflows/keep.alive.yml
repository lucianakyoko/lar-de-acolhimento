name: Keep Render Awake

on:
  schedule:
    - cron: '*/14 * * * *'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        run: |
          curl -f -s -o /dev/null \
            -w "HTTP Status: %{http_code} | Tempo: %{time_total}s\n" \
            https://lar-sao-francisco.onrender.com/api/v1/health